<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Swiss Table group probing</title>
  <desc id="desc">A 64-bit hash is split into H1 and H2. The H2 fingerprint filters 16 control bytes, and matching slots are checked with the real key.</desc>
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="56" y="62" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Group Probing：先用指纹过滤，再比较 key</text>
  <text x="56" y="94" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">Abseil 的经典 group 有 16 个 slot 和 16 字节 metadata</text>

  <g font-family="SF Mono, Menlo, monospace" font-size="16">
    <rect x="56" y="134" width="600" height="48" rx="6" fill="#0f172a"/>
    <text x="356" y="165" text-anchor="middle" fill="#ffffff">hash64(key)</text>
    <rect x="656" y="134" width="248" height="48" rx="6" fill="#e2e8f0"/>
    <text x="780" y="165" text-anchor="middle" fill="#334155">H1=57 bit / H2=7 bit</text>
  </g>

  <text x="56" y="233" font-family="SF Mono, Menlo, monospace" font-size="16" fill="#475569">metadata: 16 control bytes</text>
  <g font-family="SF Mono, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="56" y="250" width="52" height="42" rx="4" fill="#ecfdf5" stroke="#0f766e"/><text x="82" y="277" fill="#065f46">h2</text>
    <rect x="108" y="250" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="134" y="277" fill="#64748b">emp</text>
    <rect x="160" y="250" width="52" height="42" rx="4" fill="#fff7ed" stroke="#b45309"/><text x="186" y="277" fill="#9a3412">del</text>
    <rect x="212" y="250" width="52" height="42" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/><text x="238" y="277" fill="#1e3a8a">h2</text>
    <rect x="264" y="250" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="290" y="277" fill="#64748b">emp</text>
    <rect x="316" y="250" width="52" height="42" rx="4" fill="#ecfdf5" stroke="#0f766e"/><text x="342" y="277" fill="#065f46">h2</text>
    <rect x="368" y="250" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="394" y="277" fill="#64748b">emp</text>
    <rect x="420" y="250" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="446" y="277" fill="#64748b">emp</text>
    <rect x="472" y="250" width="52" height="42" rx="4" fill="#ecfdf5" stroke="#0f766e"/><text x="498" y="277" fill="#065f46">h2</text>
    <rect x="524" y="250" width="52" height="42" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/><text x="550" y="277" fill="#1e3a8a">h2</text>
    <rect x="576" y="250" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="602" y="277" fill="#64748b">emp</text>
    <rect x="628" y="250" width="52" height="42" rx="4" fill="#ecfdf5" stroke="#0f766e"/><text x="654" y="277" fill="#065f46">h2</text>
    <rect x="680" y="250" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="706" y="277" fill="#64748b">emp</text>
    <rect x="732" y="250" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="758" y="277" fill="#64748b">emp</text>
    <rect x="784" y="250" width="52" height="42" rx="4" fill="#fff7ed" stroke="#b45309"/><text x="810" y="277" fill="#9a3412">del</text>
    <rect x="836" y="250" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="862" y="277" fill="#64748b">emp</text>
  </g>

  <text x="56" y="341" font-family="SF Mono, Menlo, monospace" font-size="16" fill="#475569">slots: key/value entries</text>
  <g font-family="SF Mono, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="56" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="82" y="385" fill="#64748b">kv0</text>
    <rect x="108" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="160" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="212" y="358" width="52" height="42" rx="4" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="2"/><text x="238" y="385" fill="#1e3a8a">kv3</text>
    <rect x="264" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="316" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="342" y="385" fill="#64748b">kv5</text>
    <rect x="368" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="420" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="472" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="498" y="385" fill="#64748b">kv8</text>
    <rect x="524" y="358" width="52" height="42" rx="4" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="2"/><text x="550" y="385" fill="#1e3a8a">kv9</text>
    <rect x="576" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="628" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="654" y="385" fill="#64748b">kv11</text>
    <rect x="680" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="732" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="784" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="836" y="358" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <path d="M238 294 L238 356" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M550 294 L550 356" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="270" y="424" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1d4ed8">H2 匹配 kv3/kv9，需要比较真实 key</text>

  <line x1="56" y1="447" x2="904" y2="447" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="76" cy="493" r="5" fill="#1d4ed8"/>
  <text x="96" y="499" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">蓝色：H2 匹配，需要比较真实 key</text>
  <circle cx="76" cy="527" r="5" fill="#0f766e"/>
  <text x="96" y="533" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">绿色：已使用但指纹不匹配，直接跳过</text>
  <circle cx="76" cy="561" r="5" fill="#b45309"/>
  <text x="96" y="567" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">橙色：tombstone，表示删除过，不能当作 empty 终止探测</text>
  <text x="56" y="612" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0f172a">指纹不匹配一定不是目标 key；指纹匹配仍必须精确比较 key。</text>
</svg>
