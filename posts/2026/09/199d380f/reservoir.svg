<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="rs-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/>
    </marker>
    <marker id="rs-arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="320" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="380" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Reservoir Sampling:样本池定容 k=3,新值以 k/i 概率替换</text>
  <text x="90" y="52" text-anchor="middle" font-size="12" fill="#6b7280">数据流</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="90" cy="80" r="17" fill="#93c5fd" stroke="#2563eb"/><text x="90" y="85" fill="#1e3a8a">10</text>
    <circle cx="90" cy="130" r="17" fill="#93c5fd" stroke="#2563eb"/><text x="90" y="135" fill="#1e3a8a">40</text>
    <circle cx="90" cy="180" r="17" fill="#93c5fd" stroke="#2563eb"/><text x="90" y="185" fill="#1e3a8a">20</text>
    <circle cx="90" cy="230" r="17" fill="#fdba74" stroke="#ea580c"/><text x="90" y="235" fill="#9a3412">50</text>
    <circle cx="90" cy="280" r="17" fill="#e5e7eb" stroke="#9ca3af"/><text x="90" y="285" fill="#9ca3af">30</text>
  </g>
  <text x="122" y="124" font-size="11.5" fill="#6b7280">前 k=3 个直接入池</text>
  <text x="122" y="228" font-size="11.5" fill="#ea580c">i=4:P=3/4</text>
  <text x="122" y="278" font-size="11.5" fill="#9ca3af">i=5:P=3/5</text>
  <rect x="380" y="70" width="280" height="126" rx="10" fill="#fafafa" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="60" font-size="12.5" fill="#374151">样本池(大小 k=3)</text>
  <g fill="#ffffff" stroke="#d1d5db">
    <rect x="396" y="78" width="248" height="34" rx="6"/>
    <rect x="396" y="120" width="248" height="34" rx="6"/>
    <rect x="396" y="162" width="248" height="34" rx="6"/>
  </g>
  <text x="418" y="100" font-size="14" font-weight="700" fill="#2563eb">10</text>
  <text x="418" y="142" font-size="14" font-weight="700" fill="#d1d5db" text-decoration="line-through">40</text>
  <text x="470" y="142" font-size="14" font-weight="700" fill="#ea580c">→ 50</text>
  <text x="418" y="184" font-size="14" font-weight="700" fill="#2563eb">20</text>
  <path d="M107 230 C 250 230, 300 137, 390 137" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#rs-arr)"/>
  <text x="265" y="205" text-anchor="middle" font-size="11.5" fill="#ea580c">j=2 ≤ 3 → 替换 40</text>
  <path d="M107 280 C 300 315, 430 295, 548 250" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#rs-arr-gray)"/>
  <text x="330" y="308" text-anchor="middle" font-size="11.5" fill="#9ca3af">j=5 &gt; 3 → 放弃(本次未入池)</text>
  <text x="380" y="228" font-size="12" fill="#6b7280">查询:对池内样本做一次精确 CONT → 20</text>
</svg>
