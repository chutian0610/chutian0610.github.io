<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="td-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="380" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">t-digest:质心 —— 两端细、中间粗</text>
  <text x="700" y="36" text-anchor="end" font-size="11.5" fill="#9ca3af">圆面积 ∝ 权重</text>
  <line x1="70" y1="210" x2="710" y2="210" stroke="#9ca3af" stroke-width="1.5"/>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="100" y1="206" x2="100" y2="214"/><line x1="300" y1="206" x2="300" y2="214"/><line x1="500" y1="206" x2="500" y2="214"/><line x1="700" y1="206" x2="700" y2="214"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="100" y="232">1ms</text><text x="300" y="232">10ms</text><text x="500" y="232">100ms</text><text x="700" y="232">1000ms</text>
    <text x="70" y="252" text-anchor="start">(对数刻度,示意)</text>
  </g>
  <circle cx="160" cy="184" r="26" fill="#60a5fa" fill-opacity="0.9" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1200</text>
  <circle cx="240" cy="178" r="32" fill="#3b82f6" fill-opacity="0.9" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1800</text>
  <circle cx="551" cy="202" r="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.2"/>
  <text x="551" y="186" text-anchor="middle" font-size="11" fill="#6b7280">40</text>
  <circle cx="576" cy="205" r="5.5" fill="#93c5fd" stroke="#2563eb" stroke-width="1.2"/>
  <text x="584" y="192" text-anchor="middle" font-size="11" fill="#6b7280">18</text>
  <circle cx="698" cy="207" r="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <text x="698" y="194" text-anchor="middle" font-size="11" fill="#6b7280">1</text>
  <text x="202" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">P50 落在中部大质心(精度一般)</text>
  <line x1="240" y1="70" x2="240" y2="138" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#td-arr)"/>
  <text x="596" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">P99 落在尾部小质心(很准)</text>
  <line x1="576" y1="106" x2="576" y2="192" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#td-arr)"/>
  <g stroke="#9ca3af" stroke-width="1.2">
    <line x1="120" y1="258" x2="285" y2="258"/><line x1="120" y1="258" x2="120" y2="252"/><line x1="285" y1="258" x2="285" y2="252"/>
    <line x1="520" y1="258" x2="710" y2="258"/><line x1="520" y1="258" x2="520" y2="252"/><line x1="710" y1="258" x2="710" y2="252"/>
  </g>
  <text x="202" y="278" text-anchor="middle" font-size="12.5" fill="#6b7280">中部粗:一个质心代表上千个值</text>
  <text x="615" y="278" text-anchor="middle" font-size="12.5" fill="#6b7280">两端细:一个质心只代表一两个值</text>
</svg>
