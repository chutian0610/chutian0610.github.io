<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="gk-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="380" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">GK:用少量元组 (v, g, Δ) 覆盖全部 N 个排名</text>
  <text x="200" y="64" text-anchor="middle" font-size="11" fill="#6b7280">g=2, Δ=0</text>
  <text x="290" y="64" text-anchor="middle" font-size="11" fill="#6b7280">g=1, Δ=3</text>
  <text x="350" y="64" text-anchor="middle" font-size="11" fill="#6b7280">g=1, Δ=2</text>
  <rect x="140" y="70" width="120" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="260" y="70" width="60" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="320" y="70" width="60" height="44" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="200" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">4</text>
  <text x="290" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">5</text>
  <text x="350" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">7</text>
  <line x1="140" y1="140" x2="380" y2="140" stroke="#9ca3af" stroke-width="1.5"/>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="140" y1="136" x2="140" y2="144"/><line x1="200" y1="136" x2="200" y2="144"/><line x1="260" y1="136" x2="260" y2="144"/><line x1="320" y1="136" x2="320" y2="144"/><line x1="380" y1="136" x2="380" y2="144"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="170" y="158">rank 1</text><text x="230" y="158">rank 2</text><text x="290" y="158">rank 3</text><text x="350" y="158">rank 4</text>
  </g>
  <line x1="260" y1="196" x2="260" y2="126" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gk-arr)"/>
  <text x="268" y="166" font-size="12" fill="#6b7280">插入时压缩合并</text>
  <g fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2">
    <rect x="140" y="196" width="60" height="40"/><rect x="200" y="196" width="60" height="40"/><rect x="260" y="196" width="60" height="40"/><rect x="320" y="196" width="60" height="40"/>
  </g>
  <g font-size="14" fill="#374151" text-anchor="middle">
    <text x="170" y="221">2</text><text x="230" y="221">4</text><text x="290" y="221">5</text><text x="350" y="221">7</text>
  </g>
  <text x="400" y="221" font-size="12" fill="#6b7280">原始数据(N = 4,已排序)</text>
  <text x="70" y="276" font-size="12.5" fill="#6b7280">查询 P75(rank=3):按 g 累加——元组 4 累计 r=2,元组 5 累计 r=3 ≥ 3 且 r+Δ=6 &gt; 3+εN → 返回 5,与真实第 3 名一致</text>
</svg>
