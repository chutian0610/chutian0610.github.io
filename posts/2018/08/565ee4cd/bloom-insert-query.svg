<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Bloom Filter insertion and query</title>
  <desc id="desc">A bit array stores membership hints. The element z sees a zero bit and is definitely absent; w sees only one bits and is possibly present.</desc>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="56" y="62" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">位数组中的插入与查询</text>
  <text x="56" y="94" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">每个元素设置多个位；查询时不修改位数组</text>

  <g font-family="SF Mono, Menlo, monospace" font-size="17" text-anchor="middle">
    <rect x="80" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="105" y="182" fill="#64748b">0</text>
    <rect x="130" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="155" y="182" fill="#64748b">0</text>
    <rect x="180" y="150" width="50" height="52" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="205" y="182" fill="#065f46" font-weight="700">1</text>
    <rect x="230" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="255" y="182" fill="#64748b">0</text>
    <rect x="280" y="150" width="50" height="52" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="305" y="182" fill="#065f46" font-weight="700">1</text>
    <rect x="330" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="355" y="182" fill="#64748b">0</text>
    <rect x="380" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="405" y="182" fill="#64748b">0</text>
    <rect x="430" y="150" width="50" height="52" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="455" y="182" fill="#065f46" font-weight="700">1</text>
    <rect x="480" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="505" y="182" fill="#64748b">0</text>
    <rect x="530" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="555" y="182" fill="#64748b">0</text>
    <rect x="580" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="605" y="182" fill="#64748b">0</text>
    <rect x="630" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="655" y="182" fill="#64748b">0</text>
    <rect x="680" y="150" width="50" height="52" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="705" y="182" fill="#065f46" font-weight="700">1</text>
    <rect x="730" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="755" y="182" fill="#64748b">0</text>
    <rect x="780" y="150" width="50" height="52" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="805" y="182" fill="#065f46" font-weight="700">1</text>
    <rect x="830" y="150" width="50" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="855" y="182" fill="#64748b">0</text>
  </g>

  <g font-family="SF Mono, Menlo, monospace" font-size="13" text-anchor="middle" fill="#64748b">
    <text x="105" y="226">0</text>
    <text x="205" y="226">2</text>
    <text x="305" y="226">4</text>
    <text x="455" y="226">7</text>
    <text x="605" y="226">10</text>
    <text x="705" y="226">12</text>
    <text x="805" y="226">14</text>
  </g>

  <g font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="180" y="245" width="50" height="28" rx="14" fill="#0f766e"/><text x="205" y="264" fill="#ffffff">x</text>
    <rect x="280" y="245" width="50" height="28" rx="14" fill="#b45309"/><text x="305" y="264" fill="#ffffff">y</text>
    <rect x="425" y="245" width="60" height="28" rx="14" fill="#e2e8f0"/><text x="455" y="264" fill="#334155">x/y</text>
    <rect x="680" y="245" width="50" height="28" rx="14" fill="#0f766e"/><text x="705" y="264" fill="#ffffff">x</text>
    <rect x="780" y="245" width="50" height="28" rx="14" fill="#b45309"/><text x="805" y="264" fill="#ffffff">y</text>
  </g>

  <line x1="56" y1="317" x2="904" y2="317" stroke="#e2e8f0" stroke-width="4"/>

  <g font-family="SF Mono, Menlo, monospace" font-size="15">
    <rect x="80" y="356" width="126" height="54" rx="18" fill="#0f766e"/>
    <text x="143" y="389" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">x</text>
    <text x="226" y="389" fill="#065f46">set  [2, 7, 12]</text>

    <rect x="80" y="432" width="126" height="54" rx="18" fill="#b45309"/>
    <text x="143" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">y</text>
    <text x="226" y="465" fill="#9a3412">set  [4, 7, 14]</text>
  </g>

  <g font-family="SF Mono, Menlo, monospace" font-size="15">
    <rect x="546" y="356" width="126" height="54" rx="18" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="609" y="389" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">z</text>
    <text x="692" y="389" fill="#334155">query [1, 5, 10]</text>
    <rect x="546" y="432" width="126" height="54" rx="18" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
    <text x="609" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">w</text>
    <text x="692" y="465" fill="#9a3412">query [2, 7, 14]</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15">
    <text x="546" y="518" fill="#334155">index 5 = 0 → 一定不存在</text>
    <text x="768" y="518" fill="#9a3412">全为 1 → 可能存在</text>
  </g>
</svg>
