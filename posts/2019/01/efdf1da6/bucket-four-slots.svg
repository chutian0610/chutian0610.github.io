<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Bucketized cuckoo hash with four slots</title>
  <desc id="desc">A key has two candidate buckets, and each bucket contains four slots so empty slots can absorb collisions before eviction.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="56" y="62" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">每个 bucket 有 4 个 slot</text>
  <text x="56" y="94" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">先在两个候选 bucket 中寻找空位，空位耗尽才触发踢出</text>

  <rect x="420" y="574" width="92" height="46" rx="23" fill="#0f172a"/>
  <text x="466" y="604" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="20" font-weight="700" fill="#ffffff">key</text>
  <path d="M448 570 C351 512 266 414 203 344" stroke="#334155" stroke-width="2.25" fill="none" marker-end="url(#arrow-dark)"/>
  <path d="M484 570 C565 512 632 418 681 349" stroke="#334155" stroke-width="2.25" fill="none" marker-end="url(#arrow-dark)"/>
  <text x="82" y="378" font-family="SF Mono, Menlo, monospace" font-size="16" fill="#334155">h1(key)</text>
  <text x="816" y="380" font-family="SF Mono, Menlo, monospace" font-size="16" fill="#334155">h2(key)</text>

  <g>
    <rect x="82" y="150" width="260" height="180" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="102" y="184" font-family="SF Mono, Menlo, monospace" font-size="17" fill="#065f46">bucket 3</text>
    <rect x="102" y="203" width="220" height="23" rx="4" fill="#ecfdf5" stroke="#94a3b8"/>
    <rect x="102" y="230" width="220" height="23" rx="4" fill="#ecfdf5" stroke="#94a3b8"/>
    <rect x="102" y="257" width="220" height="23" rx="4" fill="#ecfdf5" stroke="#94a3b8"/>
    <rect x="102" y="284" width="220" height="23" rx="4" fill="#ffffff" stroke="#0f766e" stroke-dasharray="5 5"/>
    <text x="196" y="220" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#334155">A</text>
    <text x="196" y="247" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#334155">B</text>
    <text x="196" y="274" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#334155">C</text>
    <text x="157" y="301" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#0f766e">empty</text>
  </g>

  <g>
    <rect x="618" y="150" width="260" height="180" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="638" y="184" font-family="SF Mono, Menlo, monospace" font-size="17" fill="#9a3412">bucket 7</text>
    <rect x="638" y="203" width="220" height="23" rx="4" fill="#fff7ed" stroke="#94a3b8"/>
    <rect x="638" y="230" width="220" height="23" rx="4" fill="#fff7ed" stroke="#94a3b8"/>
    <rect x="638" y="257" width="220" height="23" rx="4" fill="#fff7ed" stroke="#94a3b8"/>
    <rect x="638" y="284" width="220" height="23" rx="4" fill="#fff7ed" stroke="#94a3b8"/>
    <text x="732" y="220" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#7c2d12">D</text>
    <text x="732" y="247" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#7c2d12">E</text>
    <text x="732" y="274" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#7c2d12">F</text>
    <text x="732" y="301" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#7c2d12">G</text>
  </g>

  <line x1="82" y1="358" x2="878" y2="358" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="116" cy="404" r="5" fill="#0f766e"/>
  <text x="136" y="410" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">有 empty slot：直接插入，无需踢出</text>
  <circle cx="116" cy="438" r="5" fill="#b45309"/>
  <text x="136" y="444" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">两个 bucket 都满：才选择一个已有 key 踢出</text>
  <circle cx="116" cy="472" r="5" fill="#64748b"/>
  <text x="136" y="478" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">查询仍只需顺序检查两个 bucket 内的 slot</text>
</svg>
