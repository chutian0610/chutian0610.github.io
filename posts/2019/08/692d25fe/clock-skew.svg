<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="clock-skew-title">
  <title id="clock-skew-title">时钟偏差导致全局时间戳倒退</title>
  <rect width="960" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="70" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0f172a">真实发生顺序</text>
  <line x1="90" y1="100" x2="870" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="380" cy="100" r="9" fill="#2563eb"/>
  <text x="380" y="76" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#2563eb">T1 提交</text>
  <text x="380" y="134" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">12:00:05</text>
  <circle cx="660" cy="100" r="9" fill="#16a34a"/>
  <text x="660" y="76" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#16a34a">T2 开始/提交</text>
  <text x="660" y="134" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">晚于 T1</text>

  <text x="70" y="234" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">数据库时间戳</text>
  <line x1="90" y1="280" x2="870" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="380" cy="280" r="9" fill="#2563eb"/>
  <text x="462" y="252" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#334155">s1 = 12:00:05</text>
  <circle cx="310" cy="280" r="9" fill="#dc2626"/>
  <text x="258" y="322" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#dc2626">s2 = 12:00:04</text>

  <path d="M660 112 C 660 210, 370 200, 318 269" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#red-arrow)"/>
  <text x="565" y="220" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#dc2626">落后时钟造成倒退</text>
</svg>
