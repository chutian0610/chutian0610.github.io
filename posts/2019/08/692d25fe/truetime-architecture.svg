<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="truetime-architecture-title">
  <title id="truetime-architecture-title">TrueTime 的 GPS、原子钟、time master 与 timeslave daemon 架构</title>
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arch-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="70" y="60" width="230" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">GPS master</text>
  <text x="185" y="132" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">专用天线</text>
  <text x="185" y="158" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">抗射频/GPS 故障组合</text>

  <rect x="365" y="60" width="230" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#15803d">Armageddon master</text>
  <text x="480" y="132" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">原子钟</text>
  <text x="480" y="158" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">GPS 不可用时兜底</text>

  <rect x="660" y="60" width="230" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="775" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#b91c1c">远端 masters</text>
  <text x="775" y="132" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">多个数据中心</text>
  <text x="775" y="158" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">降低单点误信风险</text>

  <path d="M300 120 H365" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arch-arrow)"/>
  <path d="M595 120 H660" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arch-arrow)"/>
  <text x="480" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#475569">定期互相校验，异常时钟自我剔除</text>

  <rect x="250" y="330" width="460" height="130" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="480" y="374" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">timeslave daemon</text>
  <text x="480" y="408" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">轮询多个 masters，用 Marzullo 变体拒绝说谎者</text>
  <text x="480" y="434" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#334155">同步本地时钟并保守公布 ε</text>

  <path d="M185 180 C 205 260, 320 300, 382 326" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <path d="M480 180 V326" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <path d="M775 180 C 755 260, 640 300, 578 326" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <text x="700" y="287" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#475569">多源轮询</text>
</svg>
