<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="commit-wait-title">
  <title id="commit-wait-title">Spanner 的 commit wait 时间线</title>
  <rect width="1040" height="430" fill="#ffffff"/>
  <defs>
    <marker id="commit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="80" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0f172a">取 latest 为提交时间戳，等待它确定过去后才可见</text>
  <rect x="230" y="140" width="230" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="345" y="182" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#0284c7">TT.now() 区间</text>
  <line x1="80" y1="270" x2="970" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#commit-arrow)"/>
  <text x="978" y="276" font-family="-apple-system, sans-serif" font-size="18" fill="#475569">时间</text>

  <line x1="230" y1="120" x2="230" y2="288" stroke="#0284c7" stroke-width="2"/>
  <line x1="460" y1="120" x2="460" y2="288" stroke="#0284c7" stroke-width="2"/>
  <text x="230" y="102" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#0284c7">earliest</text>
  <text x="460" y="102" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#0284c7">latest</text>

  <rect x="460" y="236" width="190" height="18" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <circle cx="460" cy="270" r="10" fill="#0f766e"/>
  <text x="460" y="320" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f766e">s >= latest</text>
  <text x="555" y="212" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#b45309">commit wait</text>

  <circle cx="650" cy="270" r="10" fill="#16a34a"/>
  <text x="650" y="320" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#16a34a">T1 可见</text>
  <circle cx="820" cy="270" r="10" fill="#7c3aed"/>
  <text x="850" y="320" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#7c3aed">T2 开始</text>
</svg>
