<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">网络分区下 CP 与 AP 的取舍</title>
  <desc id="desc">左侧 CP：分区一侧拒绝读写，保证一致性但牺牲可用性。右侧 AP：两侧都接受写，牺牲一致性换取可用性。</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#f8fafc"/>

  <text x="56" y="58" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">网络分区发生时，C 与 A 只能二选一</text>
  <text x="56" y="90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">分区容错性 P 是前提；下面两种策略都是"正确"的，区别只在业务取舍</text>

  <!-- ================= 左：CP ================= -->
  <rect x="56" y="118" width="404" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="76" y="138" width="196" height="30" rx="15" fill="#0f766e"/>
  <text x="174" y="159" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff">CP · 牺牲可用性 A</text>

  <rect x="80" y="200" width="140" height="76" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="150" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#065f46">节点 A</text>
  <text x="150" y="256" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#0f766e">data = v1</text>

  <rect x="320" y="200" width="140" height="76" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="390" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#065f46">节点 B</text>
  <text x="390" y="256" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#0f766e">data = v1</text>

  <line x1="270" y1="192" x2="270" y2="286" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="270" cy="238" r="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="245" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#dc2626">✕</text>
  <text x="270" y="310" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#dc2626">网络分区</text>

  <rect x="80" y="326" width="380" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="270" y="354" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#991b1b">写请求 → 节点 B：拒绝执行，返回失败</text>

  <text x="80" y="400" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#065f46">结果：两侧数据都是 v1，强一致性保持</text>
  <text x="80" y="426" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">代价：副本侧停止服务，可用性下降</text>
  <text x="80" y="452" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">典型：Paxos / Raft / ZooKeeper、分布式锁</text>

  <!-- ================= 右：AP ================= -->
  <rect x="500" y="118" width="404" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="520" y="138" width="196" height="30" rx="15" fill="#b45309"/>
  <text x="618" y="159" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff">AP · 牺牲一致性 C</text>

  <rect x="524" y="200" width="140" height="76" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="594" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#9a3412">节点 A</text>
  <text x="594" y="256" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#b45309">v1 → v2</text>

  <rect x="764" y="200" width="140" height="76" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="834" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#9a3412">节点 B</text>
  <text x="834" y="256" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#b45309">v1 → v1′</text>

  <line x1="714" y1="192" x2="714" y2="286" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="714" cy="238" r="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="714" y="245" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#dc2626">✕</text>
  <text x="714" y="310" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#dc2626">网络分区</text>

  <rect x="524" y="326" width="380" height="44" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="714" y="354" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#9a3412">写请求 → 节点 B：正常执行，返回成功</text>

  <text x="524" y="400" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9a3412">结果：两侧数据不一致，恢复时再合并</text>
  <text x="524" y="426" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">代价：可能读到旧值，脏数据需要补偿</text>
  <text x="524" y="452" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">典型：Dynamo / Cassandra、最终一致存储</text>

  <!-- ================= 底部结论 ================= -->
  <rect x="56" y="500" width="848" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="480" y="535" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#3730a3">P 是前提：分区发生时 C 与 A 必居其一；没有分区时，C 与 A 可以同时满足</text>
</svg>
